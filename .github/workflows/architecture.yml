name: Architecture checks

on:
  pull_request:
    paths:
      - ".github/workflows/architecture.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "scripts/**"
      - "packages/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/architecture.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "scripts/**"
      - "packages/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: npm
      - name: Install dependencies for source checks
        run: npm ci --ignore-scripts
      - name: Check formatting and lint
        run: npm run check:biome
      - name: Check pinned dependencies
        run: npm run check:pinned-deps
      - name: Check generated protocol schema
        run: npm run check:generated --workspace @metis/app-protocol
      - name: Check dependency locks
        run: npm run check:shrinkwrap && npm run check:install-lock:coding-agent
      - name: Check source and test types
        run: npm run check:types
      - name: Check TypeScript imports
        run: npm run check:ts-imports
      - name: Check package boundaries
        run: npm run check:boundaries
      - name: Check runtime structure
        # Runtime cycles and the public API surface are hard gates; the dead
        # export report inside the same process is advisory.
        run: npm run check:structure
      - name: Report newly duplicated implementations
        continue-on-error: true
        run: npm run check:dup
      - name: Report unused dependency candidates
        continue-on-error: true
        run: npm run check:unused-deps
      - name: Test architecture guards
        run: npm run check:scripts
      - name: Report type debt and suppression increases
        continue-on-error: true
        run: npm run check:type-debt
      - name: Report presentation boundary regressions
        continue-on-error: true
        run: npm run check:presentation-boundaries
