name: Architecture checks

on:
  pull_request:
    paths:
      - ".github/workflows/architecture.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "scripts/**"
      - "packages/**"
      - "test.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/architecture.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "scripts/**"
      - "packages/**"
      - "test.sh"
  schedule:
    # Nightly only: native Windows probes need a Windows runner, which is not
    # worth a per-push cost. Push/PR runs stay on the Linux architecture job.
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: npm
      - name: Install dependencies for source checks
        run: npm ci --ignore-scripts
      - name: Check formatting and lint
        run: npm run check:biome
      - name: Check pinned dependencies
        run: npm run check:pinned-deps
      - name: Check generated protocol schema
        run: npm run check:generated --workspace @metis/app-protocol
      - name: Check dependency locks
        run: npm run check:shrinkwrap && npm run check:install-lock:coding-agent
      - name: Check source and test types
        run: npm run check:types
      - name: Check TypeScript imports
        run: npm run check:ts-imports
      - name: Check package boundaries
        run: npm run check:boundaries
      - name: Check runtime structure
        # Runtime cycles and the public API surface are hard gates; the dead
        # export report inside the same process is advisory.
        run: npm run check:structure
      - name: Report newly duplicated implementations
        continue-on-error: true
        run: npm run check:dup
      - name: Report unused dependency candidates
        continue-on-error: true
        run: npm run check:unused-deps
      - name: Report production dependency advisories
        # Needs registry access, so it stays out of the local gate. Accepted
        # advisories carry a reviewed reason in scripts/baselines/security-audit.json.
        continue-on-error: true
        run: npm run check:audit
      - name: Test architecture guards
        run: npm run check:scripts
      - name: Report type debt and suppression increases
        continue-on-error: true
        run: npm run check:type-debt
      - name: Report presentation boundary regressions
        continue-on-error: true
        run: npm run check:presentation-boundaries

  package-unit-tests:
    # Required gate for the packages the desktop workflow does not test.
    # coding-agent tests load built dist assets, so this builds first.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: npm
      - name: Install Linux test tools
        # Ubuntu names the fd binary fdfind. Tests and ./test.sh look up fd.
        # bubblewrap and socat are the Linux sandbox runtime used by coding-agent tests.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap fd-find ripgrep socat trash-cli
          sudo ln -sfn "$(command -v fdfind)" /usr/local/bin/fd
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          command -v fd
          command -v rg
          command -v trash
          command -v bwrap
          command -v socat
      - name: Install dependencies
        run: npm ci
      - name: Build packages required by unit tests
        env:
          METIS_SKIP_MODEL_REGENERATION: "1"
        run: npm run build
      - name: Run package unit tests
        run: |
          npm test --workspace @metis/ai
          npm test --workspace @metis/agent-core
          npm test --workspace @metis/coding-agent
          npm test --workspace @metis/tui

  windows-native:
    # Native Windows acceptance probes (W19). These cannot be proven by the
    # cross-platform suites, so they run on a real Windows runner. Scheduled and
    # manual only to keep per-push cost at zero; see npm run verify:windows.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: npm
      - name: Install dependencies for native probes
        run: npm ci --ignore-scripts
      - name: Build runtime assets for native probes
        # The shell-analysis grammar and native tools load from staged build
        # assets, so probes need a build before they can run.
        env:
          METIS_SKIP_MODEL_REGENERATION: "1"
        run: npm run build
      - name: Run native Windows acceptance probes
        run: npm run verify:windows
